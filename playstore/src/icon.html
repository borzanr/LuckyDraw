<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #0B0F14; }
  svg { display: block; }
</style>

<!--
  Ícone da Play Store: 512x512, sem transparência (a Play aplica a máscara
  arredondada por conta própria). Um dado é a metáfora universal de sorteio e
  continua legível a 48px, que é o tamanho que decide o download.
-->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="die" x1="14%" y1="0%" x2="86%" y2="100%">
      <stop offset="0%" stop-color="#D4FF6E"/>
      <stop offset="46%" stop-color="#B4FF39"/>
      <stop offset="100%" stop-color="#7BD400"/>
    </linearGradient>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101822"/>
      <stop offset="100%" stop-color="#070A0E"/>
    </linearGradient>

    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="17" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- Confetes: leves, só para dar movimento sem competir com o dado -->
  <g opacity="0.85">
    <rect x="74" y="86" width="22" height="11" rx="3" fill="#00E5FF" transform="rotate(-24 85 91)"/>
    <rect x="404" y="122" width="19" height="10" rx="3" fill="#A855F7" transform="rotate(32 413 127)"/>
    <circle cx="428" cy="330" r="8" fill="#00E5FF"/>
    <rect x="66" y="356" width="17" height="9" rx="3" fill="#FFD166" transform="rotate(18 74 360)"/>
    <circle cx="112" cy="228" r="6" fill="#A855F7"/>
    <rect x="386" y="404" width="15" height="8" rx="3" fill="#B4FF39" transform="rotate(-38 393 408)"/>
  </g>

  <!-- Dado -->
  <g transform="rotate(-11 256 262)" filter="url(#glow)">
    <rect x="130" y="136" width="252" height="252" rx="58" fill="url(#die)"/>
    <rect x="130" y="136" width="252" height="252" rx="58" fill="none"
          stroke="#EAFFC0" stroke-opacity="0.55" stroke-width="3"/>
    <g fill="#0B0F14">
      <circle cx="196" cy="202" r="25"/>
      <circle cx="316" cy="202" r="25"/>
      <circle cx="256" cy="262" r="25"/>
      <circle cx="196" cy="322" r="25"/>
      <circle cx="316" cy="322" r="25"/>
    </g>
  </g>
</svg>
