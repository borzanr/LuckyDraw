<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1024px; height: 500px; overflow: hidden;
    background: #0B0F14;
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    position: relative;
  }
  /* Halo neon atrás do dado, do lado direito */
  .halo {
    position: absolute; right: -80px; top: -110px;
    width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,229,255,.24) 0%, rgba(0,229,255,.06) 52%, rgba(0,229,255,0) 72%);
  }
  .halo2 {
    position: absolute; left: -160px; bottom: -240px;
    width: 560px; height: 560px; border-radius: 50%;
    background: radial-gradient(circle, rgba(180,255,57,.15) 0%, rgba(180,255,57,0) 70%);
  }
  .wrap { position: relative; display: flex; align-items: center; height: 100%; padding: 0 58px; box-sizing: border-box; }
  .copy { flex: 1; }
  .name {
    font-size: 82px; font-weight: 800; letter-spacing: -2.5px;
    color: #E8EEF5; margin: 0 0 14px; line-height: 1;
  }
  .name em { font-style: normal; color: #B4FF39; }
  .tag {
    font-size: 31px; font-weight: 600; color: #93A1B1; margin: 0 0 26px; letter-spacing: -.3px;
  }
  .pills { display: flex; gap: 10px; }
  .pill {
    font-size: 19px; font-weight: 600; color: #0B0F14; white-space: nowrap;
    background: #00E5FF; border-radius: 999px; padding: 9px 20px;
  }
  .pill.alt { background: rgba(180,255,57,.16); color: #B4FF39; box-shadow: inset 0 0 0 1.5px rgba(180,255,57,.45); }
  .art { width: 300px; flex: none; display: flex; justify-content: center; }
  .confetti { position: absolute; border-radius: 3px; }
</style>

<div class="halo"></div>
<div class="halo2"></div>

<!-- Confetes espalhados, bem discretos -->
<div class="confetti" style="left:62px;  top:66px;  width:26px; height:12px; background:#00E5FF; transform:rotate(-24deg);"></div>
<div class="confetti" style="left:520px; top:44px;  width:20px; height:10px; background:#A855F7; transform:rotate(34deg);"></div>
<div class="confetti" style="left:44px;  top:392px; width:22px; height:11px; background:#FFD166; transform:rotate(16deg);"></div>
<div class="confetti" style="left:600px; top:430px; width:18px; height:9px;  background:#B4FF39; transform:rotate(-40deg);"></div>
<div class="confetti" style="left:988px; top:214px; width:16px; height:16px; border-radius:50%; background:#00E5FF; opacity:.75;"></div>
<div class="confetti" style="left:486px; top:392px; width:12px; height:12px; border-radius:50%; background:#A855F7; opacity:.8;"></div>

<div class="wrap">
  <div class="copy">
    <h1 class="name">Lucky<em>Draw</em></h1>
    <p class="tag" id="tag"></p>
    <div class="pills">
      <span class="pill" id="pill1"></span>
      <span class="pill alt" id="pill2"></span>
      <span class="pill alt" id="pill3"></span>
    </div>
  </div>

  <div class="art">
    <svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="die" x1="14%" y1="0%" x2="86%" y2="100%">
          <stop offset="0%" stop-color="#D4FF6E"/>
          <stop offset="46%" stop-color="#B4FF39"/>
          <stop offset="100%" stop-color="#7BD400"/>
        </linearGradient>
        <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
          <feGaussianBlur stdDeviation="14" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g transform="rotate(-11 150 150)" filter="url(#glow)">
        <rect x="34" y="34" width="232" height="232" rx="54" fill="url(#die)"/>
        <rect x="34" y="34" width="232" height="232" rx="54" fill="none"
              stroke="#EAFFC0" stroke-opacity="0.5" stroke-width="3"/>
        <g fill="#0B0F14">
          <circle cx="95"  cy="95"  r="23"/>
          <circle cx="205" cy="95"  r="23"/>
          <circle cx="150" cy="150" r="23"/>
          <circle cx="95"  cy="205" r="23"/>
          <circle cx="205" cy="205" r="23"/>
        </g>
      </g>
    </svg>
  </div>
</div>

<script>
  // Mesmo gráfico nos três idiomas da ficha; só a tagline e as pílulas mudam.
  var COPY = {
    pt: {
      tag: "Sorteador de nomes e números",
      pills: ["Sorteio em 1 toque", "Sem cadastro", "Funciona offline"]
    },
    en: {
      tag: "Random name and number picker",
      pills: ["Draw in one tap", "No sign-up", "Works offline"]
    },
    es: {
      tag: "Sorteador de nombres y números",
      pills: ["Sorteo en un toque", "Sin registro", "Sin conexión"]
    }
  };

  var requested = new URLSearchParams(location.search).get("lang");
  var copy = COPY[requested] || COPY.pt;

  document.getElementById("tag").textContent = copy.tag;
  copy.pills.forEach(function (text, i) {
    document.getElementById("pill" + (i + 1)).textContent = text;
  });
</script>
